name: Update and publish Texas Sales Tax Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '20 15 * * *'  # Daily at 15:20 UTC; GitHub schedules may run late
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.json'
      - 'normalize_history.py'
      - 'validate_history.py'
      - '.github/workflows/update-dashboard.yml'
      - 'fetch_city_history.py'
      - 'fetch_local.py'
      - 'patch_city_dashboard.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: texas-sales-tax-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XLSX reader
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Download and normalize official historical sources
        run: python normalize_history.py
      - name: Validate normalized history
        run: python validate_history.py
      - name: Download and validate municipal allocations
        run: python fetch_city_history.py --start-year 2023
      - name: Commit validated monthly observations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add normalized/monthly.csv local/city_allocations.csv local/years/*.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated Texas monthly industry history'
            git pull --rebase origin main
            git push origin HEAD:main

          fi
      - name: Assemble public site
        run: |
          mkdir -p _site/normalized _site/local
          cp index.html data.json _site/
          cp normalized/monthly.csv _site/normalized/monthly.csv
          cp local/city_allocations.csv _site/local/city_allocations.csv
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public site
        id: deployment
        uses: actions/deploy-pages@v4
